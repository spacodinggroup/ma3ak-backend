services:
  - type: web
    name: ma3ak-backend
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_KEY
        sync: false
      - key: GROK_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
